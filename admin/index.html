<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wi-Fry Admin</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#1b1b16;--bg:#f6f4ed;--gold:#f4c542;--muted:#77766d;--line:#e6e2d7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.btn{border:0;border-radius:10px;background:var(--ink);color:#fff;padding:12px 16px;font-weight:800}.gold{background:var(--gold);color:var(--ink)}.brand{font:700 20px "Space Grotesk";margin-bottom:24px}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.box,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:25px}.box{width:min(440px,100%)}h1,h2{font-family:"Space Grotesk"}.muted{color:var(--muted);font-size:13px;line-height:1.7}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:11px;font-weight:800;color:#555}.field input,.field textarea{padding:12px;border:1px solid var(--line);border-radius:9px;width:100%}.field textarea{min-height:90px}.error{color:#b22;font-size:12px}.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{background:var(--ink);color:white;padding:20px;display:flex;flex-direction:column;gap:9px}.side button{border:0;background:#333329;color:white;padding:12px;border-radius:9px;text-align:left;font-weight:700}.side button:hover{color:var(--gold)}.main{padding:30px;min-width:0}.main h1{font-size:30px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;min-width:130px}.stat strong{display:block;font:700 26px "Space Grotesk"}.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:12px;overflow:auto}.lane{background:#eeece4;border-radius:13px;padding:12px;min-height:180px}.task,.announcement{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px;margin:9px 0}.task p,.announcement p{font-size:12px;color:var(--muted);white-space:pre-wrap}.small{font-size:11px;color:var(--muted)}.task select{max-width:125px;font-size:11px;padding:5px}.panel{margin:15px 0}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:3;flex-direction:row;overflow:auto;padding:9px}.side .brand{display:none}.side button{white-space:nowrap;padding:9px}.main{padding:18px 12px}.board{grid-template-columns:repeat(4,210px)}}
</style></head><body><div id="app"><div class="wrap">Loading Wi-Fry admin…</div></div><script>
const API="https://wi-fry-studios.joel-robinson-952.workers.dev/api/";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function req(p,m="GET",d){const r=await fetch(API+p,{method:m,credentials:"include",headers:{"content-type":"application/json"},body:d?JSON.stringify(d):undefined});let x=await r.json();if(!r.ok)throw Error(x.error||"Request failed");return x}
function shell(title,content){$("#app").innerHTML='<div class="shell"><aside class="side"><div class="brand">🍟 Wi-Fry</div><button onclick="page(\'Overview\')">Overview</button><button onclick="page(\'Tasks\')">Task board</button><button onclick="page(\'Announcements\')">Announcements</button><button onclick="page(\'Website editor\')">Website editor</button><button onclick="page(\'Admins\')">Admin accounts</button><button onclick="logout()">Sign out</button><a class="small" style="color:#ccc;margin-top:auto" href="../">← Public website</a></aside><main class="main"><div class="row"><div><div class="small">STUDIO CONTROL ROOM</div><h1>'+title+'</h1></div><span class="small" id="who"></span></div><div id="content">'+content+'</div></main></div>'}
async function start(){try{const s=await req("status");if(s.setupRequired){setup();return}await req("me");page("Overview")}catch(e){login()}}
function login(msg=""){ $("#app").innerHTML='<div class="wrap"><div class="box"><div class="brand">🍟 Wi-Fry Studios</div><h1>Admin sign in</h1><p class="muted">Use your approved GitHub account to access the studio control room.</p><button class="btn gold" onclick="location.href=\'https://wi-fry-studios.joel-robinson-952.workers.dev/auth/github\'">Continue with GitHub ↗</button><p class="error">'+esc(msg)+'</p><p class="small">Only GitHub accounts added by a Wi-Fry admin can sign in.</p><a href="../" class="small">← Back to website</a></div></div>'}
function setup(){ $("#app").innerHTML='<div class="wrap"><form class="box" id="setup"><div class="brand">🍟 Wi-Fry Studios</div><h1>First admin setup</h1><p class="muted">Register the first GitHub account allowed to administer Wi-Fry. You need the one-time setup key from the site owner.</p><div class="field"><label>ONE-TIME SETUP KEY</label><input name="key" required></div><div class="field"><label>GITHUB USERNAME</label><input name="username" placeholder="your-github-name" required></div><button class="btn gold">Register first admin</button><p id="err" class="error"></p></form></div>';$("#setup").onsubmit=async e=>{e.preventDefault();try{await req("github/setup","POST",Object.fromEntries(new FormData(e.target)));login("First admin registered. Sign in with GitHub.")}catch(x){$("#err").textContent=x.message}}}
let tasks=[],ann=[],site={};
async function page(tab){const me=await req("me");shell(tab,"");$("#who").textContent="Signed in · "+(me.user.github_username||"Admin");let c=$("#content");
if(tab==="Overview"){let t=await req("tasks"),a=await req("public");tasks=t.tasks;ann=a.announcements;site=a.site||{};c.innerHTML='<div class="stats"><div class="stat"><strong>'+tasks.length+'</strong><span class="small">TOTAL TASKS</span></div><div class="stat"><strong>'+tasks.filter(x=>x.status==="doing").length+'</strong><span class="small">IN PROGRESS</span></div><div class="stat"><strong>'+tasks.filter(x=>x.status==="done").length+'</strong><span class="small">COMPLETED</span></div><div class="stat"><strong>'+ann.length+'</strong><span class="small">ANNOUNCEMENTS</span></div></div><div class="panel"><h2>Welcome back 👋</h2><p class="muted">Manage your studio work, publish updates and edit the public website.</p></div>';return}
if(tab==="Tasks"){tasks=(await req("tasks")).tasks;let lanes=[["todo","To do"],["doing","In progress"],["review","Review"],["done","Done"]];c.innerHTML='<div class="row"><p class="muted">Move tasks through the studio pipeline.</p><button class="btn gold" onclick="addTask()">＋ New task</button></div><div class="board">'+lanes.map(([k,v])=>'<div class="lane"><b>'+v+' · '+tasks.filter(t=>t.status===k).length+'</b>'+tasks.filter(t=>t.status===k).map(t=>'<div class="task"><b>'+esc(t.title)+'</b><p>'+esc(t.description)+'</p><span class="small">'+esc(t.assignee||"Unassigned")+' · '+esc(t.priority)+'</span><p><select onchange="move(\''+t.id+'\',this.value)">'+[["todo","To do"],["doing","In progress"],["review","Review"],["done","Done"]].map(([a,b])=>'<option value="'+a+'" '+(a===k?"selected":"")+'>'+b+'</option>').join("")+'</select> <button class="small" onclick="delTask(\''+t.id+'\')">Delete</button></p></div>').join("")+'</div>').join("")+'</div>';return}
if(tab==="Announcements"){ann=(await req("public")).announcements;c.innerHTML='<div class="panel"><h2>Publish an update</h2><form id="announce"><div class="field"><label>TITLE</label><input name="title" required></div><div class="field"><label>MESSAGE</label><textarea name="body" required></textarea></div><label class="small"><input type="checkbox" name="pinned"> Pin announcement</label><p><button class="btn gold">Publish</button></p></form></div><div class="panel"><h2>Published announcements</h2>'+ann.map(a=>'<div class="announcement"><b>'+esc(a.title)+'</b><p>'+esc(a.body)+'</p><button class="small" onclick="delAnn(\''+a.id+'\')">Delete</button></div>').join("")+'</div>';$("#announce").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);await req("announcements","POST",{title:f.get("title"),body:f.get("body"),pinned:f.get("pinned")==="on"});page(tab)};return}
if(tab==="Website editor"){site=(await req("public")).site||{};c.innerHTML='<div class="panel"><h2>Edit the public website</h2><form id="edit">'+field("headline","Headline",site.headline||"Small team. Big fries. Bigger games.")+field("tagline","Tagline",site.tagline||"We're Wi-Fry Studios — a group of creators building fun, memorable Roblox experiences.")+field("about","About us",site.about||"Wi-Fry Studios is a Roblox development group.",true)+field("roblox","Roblox URL",site.roblox||"")+field("discord","Discord invite",site.discord||"")+'<button class="btn gold">Save changes</button></form></div>';$("#edit").onsubmit=async e=>{e.preventDefault();await req("site","PUT",Object.fromEntries(new FormData(e.target)));alert("Website updated!");page(tab)};return}
if(tab==="Admins"){let d=await req("admins");c.innerHTML='<div class="panel"><h2>Add an admin</h2><p class="muted">Enter their exact GitHub username. They will be able to sign in with GitHub.</p><form id="newadmin"><div class="field"><label>GITHUB USERNAME</label><input name="username" placeholder="github-username" required></div><button class="btn gold">Add GitHub admin</button></form></div><div class="panel"><h2>Approved accounts</h2>'+d.admins.map(a=>'<p>'+esc(a.github_username)+' <button class="small" onclick="delAdmin(\''+a.id+'\')">Remove</button></p>').join("")+'</div>';$("#newadmin").onsubmit=async e=>{e.preventDefault();try{await req("admins","POST",Object.fromEntries(new FormData(e.target)));page(tab)}catch(x){alert(x.message)}}}
}
function field(n,l,v,area=false){return '<div class="field"><label>'+l.toUpperCase()+'</label>'+(area?'<textarea name="'+n+'">'+esc(v)+'</textarea>':'<input name="'+n+'" value="'+esc(v)+'">')+'</div>'}
async function addTask(){let title=prompt("Task title");if(!title)return;let description=prompt("Description")||"",assignee=prompt("Assignee")||"",priority=prompt("Priority: low, medium or high","medium")||"medium";await req("tasks","POST",{title,description,assignee,priority});page("Tasks")}
async function move(id,status){await req("tasks/"+id,"PATCH",{status});page("Tasks")}
async function delTask(id){if(confirm("Delete this task?")){await req("tasks/"+id,"DELETE");page("Tasks")}}
async function delAnn(id){if(confirm("Delete this announcement?")){await req("announcements/"+id,"DELETE");page("Announcements")}}
async function delAdmin(id){if(confirm("Remove this admin?")){await req("admins/"+id,"DELETE");page("Admins")}}
async function logout(){await req("logout","POST",{});login("Signed out.")}
start();
</script></body></html>
