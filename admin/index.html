<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wi-Fry Admin</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#1b1b16;--bg:#f6f4ed;--gold:#f4c542;--muted:#77766d;--line:#e6e2d7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.btn{border:0;border-radius:10px;background:var(--ink);color:#fff;padding:12px 16px;font-weight:800}.gold{background:var(--gold);color:var(--ink)}h1,h2,.brand{font-family:"Space Grotesk"}.brand{font-weight:700;font-size:21px}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.box,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:25px}.box{width:min(470px,100%)}.muted,.small{color:var(--muted);font-size:12px;line-height:1.7}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:11px;font-weight:800}.field input,.field textarea{padding:12px;border:1px solid var(--line);border-radius:9px;width:100%}.field textarea{min-height:90px}.error{color:#b22;font-size:12px}.notice{background:#fff7d8;padding:12px;border-radius:10px;font-size:12px;line-height:1.6}.shell{display:grid;grid-template-columns:205px 1fr;min-height:100vh}.side{background:var(--ink);color:white;padding:18px;display:flex;flex-direction:column;gap:9px}.side button{border:0;background:#333329;color:white;padding:11px;border-radius:9px;text-align:left;font-weight:700}.main{padding:28px;min-width:0}.row,.stats{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;min-width:125px}.stat strong{display:block;font:700 25px "Space Grotesk"}.panel{margin:15px 0}.board{display:grid;grid-template-columns:repeat(4,minmax(185px,1fr));gap:12px;overflow:auto}.lane{background:#eeece4;border-radius:13px;padding:12px;min-height:180px}.task,.announcement{background:white;border:1px solid var(--line);border-radius:10px;padding:12px;margin:9px 0}.task p,.announcement p{font-size:12px;color:var(--muted);white-space:pre-wrap}.task select{max-width:125px;font-size:11px}.smallbtn{border:0;background:none;text-decoration:underline;font-size:11px;color:#666}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:2;flex-direction:row;overflow:auto;padding:8px}.side .brand{display:none}.side button{white-space:nowrap;padding:9px}.main{padding:16px 11px}.board{grid-template-columns:repeat(4,210px)}}
</style></head><body><div id="app">Loading…</div><script>
const OWNER="joelrobinson952-stack",REPO="wi-fry",BASE="https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/",BRANCH="main",$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token=sessionStorage.getItem("wf_token")||"",me,admins=[],tasks=[],ann=[],site={};
async function api(path,method="GET",body){let u=BASE+path+(path.includes("?")?"&":"?")+"ref="+BRANCH,r=await fetch(u,{method,headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(d.message||"GitHub API error "+r.status);return d}
async function read(path){let d=await api(path);return {data:JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,""))))),sha:d.sha}}
async function write(path,data,msg){let old=await api(path),bytes=new TextEncoder().encode(JSON.stringify(data,null,2)+"\n"),binary=Array.from(bytes,x=>String.fromCharCode(x)).join(""),content=btoa(binary);await api(path,"PUT",{message:msg,content,sha:old.sha,branch:BRANCH})}
async function load(){[admins,tasks,ann,site]=await Promise.all(["data/admins.json","data/tasks.json","data/announcements.json","data/site.json"].map(async p=>(await read(p)).data))}
function login(error=""){ $("#app").innerHTML='<div class="wrap"><form class="box" id="login"><div class="brand">🍟 Wi-Fry Studios</div><h1>Admin sign in</h1><p class="muted">Connect using a GitHub Personal Access Token. It stays in this browser session only.</p><div class="notice">Create a fine-grained token in GitHub Settings → Developer settings → Personal access tokens. Select this repository only and grant <b>Contents: Read and write</b>.</div><div class="field"><label>GITHUB TOKEN</label><input name="token" type="password" required autocomplete="off" placeholder="github_pat_…"></div><button class="btn gold">Connect to GitHub</button><p class="error">'+esc(error)+'</p><p class="small">Only usernames listed in data/admins.json can sign in.</p><a href="../" class="small">← Public website</a></form></div>';$("#login").onsubmit=async e=>{e.preventDefault();token=new FormData(e.target).get("token").trim();try{let r=await fetch("https://api.github.com/user",{headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json"}});if(!r.ok)throw Error("GitHub rejected that token.");me=await r.json();await load();if(!admins.some(a=>a.toLowerCase()===me.login.toLowerCase()))throw Error("@"+me.login+" is not an approved Wi-Fry admin.");sessionStorage.setItem("wf_token",token);page("Overview")}catch(x){token="";login(x.message)}}}
function shell(title){$("#app").innerHTML='<div class="shell"><aside class="side"><div class="brand">🍟 Wi-Fry</div><button onclick="page(\'Overview\')">Overview</button><button onclick="page(\'Tasks\')">Task board</button><button onclick="page(\'Announcements\')">Announcements</button><button onclick="page(\'Website editor\')">Website editor</button><button onclick="page(\'Admins\')">Admins</button><button onclick="logout()">Sign out</button><a class="small" style="color:#ccc;margin-top:auto" href="../">← Website</a></aside><main class="main"><div class="row"><h1>'+title+'</h1><span class="small">@'+esc(me.login)+'</span></div><div id="content"></div></main></div>'}
async function page(tab){await load();shell(tab);let c=$("#content");
if(tab==="Overview"){c.innerHTML='<div class="stats"><div class="stat"><strong>'+tasks.length+'</strong><span class="small">TASKS</span></div><div class="stat"><strong>'+tasks.filter(t=>t.status==="doing").length+'</strong><span class="small">IN PROGRESS</span></div><div class="stat"><strong>'+tasks.filter(t=>t.status==="done").length+'</strong><span class="small">COMPLETED</span></div><div class="stat"><strong>'+ann.length+'</strong><span class="small">ANNOUNCEMENTS</span></div></div><div class="panel"><h2>Welcome back 👋</h2><p class="muted">Your site, tasks and announcements are stored directly in GitHub. No external backend.</p></div>';return}
if(tab==="Tasks"){let lanes=[["todo","To do"],["doing","In progress"],["review","Review"],["done","Done"]];c.innerHTML='<div class="row"><p class="muted">Studio task board</p><button class="btn gold" onclick="addTask()">＋ New task</button></div><div class="board">'+lanes.map(([k,v])=>'<div class="lane"><b>'+v+' · '+tasks.filter(t=>t.status===k).length+'</b>'+tasks.filter(t=>t.status===k).map(t=>'<div class="task"><b>'+esc(t.title)+'</b><p>'+esc(t.description)+'</p><span class="small">'+esc(t.assignee||"Unassigned")+' · '+esc(t.priority)+'</span><p><select onchange="moveTask(\''+t.id+'\',this.value)">'+lanes.map(([a,b])=>'<option value="'+a+'" '+(a===k?"selected":"")+'>'+b+'</option>').join("")+'</select> <button class="smallbtn" onclick="delTask(\''+t.id+'\')">Delete</button></p></div>').join("")+'</div>').join("")+'</div>';return}
if(tab==="Announcements"){c.innerHTML='<div class="panel"><h2>Publish announcement</h2><form id="af"><div class="field"><label>TITLE</label><input name="title" required></div><div class="field"><label>MESSAGE</label><textarea name="body" required></textarea></div><label class="small"><input type="checkbox" name="pinned"> Pin announcement</label><p><button class="btn gold">Publish</button></p></form></div><div class="panel"><h2>Published</h2>'+ann.map(a=>'<div class="announcement"><b>'+esc(a.title)+'</b><p>'+esc(a.body)+'</p><button class="smallbtn" onclick="delAnn(\''+a.id+'\')">Delete</button></div>').join("")+'</div>';$("#af").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);ann.unshift({id:crypto.randomUUID(),title:f.get("title"),body:f.get("body"),pinned:f.get("pinned")==="on",created_at:new Date().toISOString()});ann.sort((a,b)=>Number(b.pinned)-Number(a.pinned));await write("data/announcements.json",ann,"Publish announcement");page(tab)};return}
if(tab==="Website editor"){c.innerHTML='<div class="panel"><h2>Edit homepage</h2><form id="sf">'+field("headline","Headline",site.headline)+field("tagline","Tagline",site.tagline,true)+field("about","About",site.about,true)+field("roblox","Roblox URL",site.roblox)+field("discord","Discord URL",site.discord)+'<button class="btn gold">Save changes</button></form></div>';$("#sf").onsubmit=async e=>{e.preventDefault();site=Object.fromEntries(new FormData(e.target));await write("data/site.json",site,"Update homepage settings");alert("Saved to GitHub!");page(tab)};return}
if(tab==="Admins"){c.innerHTML='<div class="panel"><h2>Add admin</h2><form id="uf"><div class="field"><label>GITHUB USERNAME</label><input name="username" required></div><button class="btn gold">Add admin</button></form></div><div class="panel"><h2>Approved accounts</h2>'+admins.map(a=>'<p>@'+esc(a)+' '+(a.toLowerCase()===me.login.toLowerCase()?'(you)':'<button class="smallbtn" onclick="delAdmin(\''+esc(a)+'\')">Remove</button>')+'</p>').join("")+'</div>';$("#uf").onsubmit=async e=>{e.preventDefault();let n=new FormData(e.target).get("username").trim().replace(/^@/,"");if(!/^[A-Za-z0-9-]{1,39}$/.test(n))return alert("Invalid GitHub username");if(!admins.some(a=>a.toLowerCase()===n.toLowerCase()))admins.push(n);await write("data/admins.json",admins,"Add admin");page(tab)}}
}
function field(n,l,v,area=false){return '<div class="field"><label>'+l.toUpperCase()+'</label>'+(area?'<textarea name="'+n+'">'+esc(v||"")+'</textarea>':'<input name="'+n+'" value="'+esc(v||"")+'">')+'</div>'}
async function addTask(){let title=prompt("Task title");if(!title)return;tasks.unshift({id:crypto.randomUUID(),title,description:prompt("Description")||"",assignee:prompt("Assignee")||"",priority:prompt("Priority: low, medium or high","medium")||"medium",status:"todo"});await write("data/tasks.json",tasks,"Create task");page("Tasks")}
async function moveTask(id,status){tasks=tasks.map(t=>t.id===id?{...t,status}:t);await write("data/tasks.json",tasks,"Move task");page("Tasks")}
async function delTask(id){if(confirm("Delete task?")){tasks=tasks.filter(t=>t.id!==id);await write("data/tasks.json",tasks,"Delete task");page("Tasks")}}
async function delAnn(id){if(confirm("Delete announcement?")){ann=ann.filter(a=>a.id!==id);await write("data/announcements.json",ann,"Delete announcement");page("Announcements")}}
async function delAdmin(n){if(n.toLowerCase()===me.login.toLowerCase())return alert("You cannot remove yourself.");if(confirm("Remove @"+n+"?")){admins=admins.filter(a=>a.toLowerCase()!==n.toLowerCase());await write("data/admins.json",admins,"Remove admin");page("Admins")}}
function logout(){sessionStorage.removeItem("wf_token");token="";login("Signed out.")}
(async()=>{if(!token)return login();try{let r=await fetch("https://api.github.com/user",{headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json"}});if(!r.ok)throw Error();me=await r.json();await load();if(!admins.some(a=>a.toLowerCase()===me.login.toLowerCase()))throw Error();page("Overview")}catch{logout()}})();
</script></body></html>
